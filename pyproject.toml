[project]
name = "python-flask-bootcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Feartheyc", email = "78522427+Feartheyc@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "mysql-connector-python>=26.10.0",
    "mysqlclient>=2.3.0",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.1.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]

[project.scripts]
python-flask-bootcamp = "python_flask_bootcamp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
